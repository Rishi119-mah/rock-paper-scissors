<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="out">
        <div class="head-div">
        <h1 class="head">ROCK PAPER SCISSORS</h1>
        </div>
    </div>


    <div class="choices">
        <button class="choice" value="Paper">
            <img src="./paper game icon.png">
        </button>
        <button class="choice" value="Rock">
            <img src="./rock paper icon.png">
        </button>
        <button class="choice" value="Scissor">
            <img src="./scissor game icon.png">
        </button>
    </div>
   
    <div class="win-text">
        <p class="result">Winner</p>
    </div>

    <div class="reset-btn">
        <button class="reset">RESET</button>
    </div>
    
    <script src="./app.js"></script>
</body>
</html>
